name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test (synthetic)
        run: |
          climbtrack synth -o s.csv --labels l.csv --seed 1
          climbtrack analyze s.csv --labels l.csv -o out --synthetic
