[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climbtrack"
version = "0.1.0"
description = "Climbing session tracking from a wrist IMU: climb/rest segmentation, time-on-wall, movement smoothness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tommaso Maggiolo" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
keywords = ["climbing", "imu", "accelerometer", "hmm", "wearables", "sports-science"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
fit = ["fitdecode>=0.10"]
dev = ["pytest>=7", "fitdecode>=0.10"]

[project.scripts]
climbtrack = "climbtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
